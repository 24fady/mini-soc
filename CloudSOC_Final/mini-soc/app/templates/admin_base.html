<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Console{% endblock %} | CloudSOC Engine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Cloud<b>SOC</b> Engine
    </div>
    {% if session.get('admin_id') %}
    <nav>
      <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if request.endpoint == 'admin.dashboard' }}">Dashboard</a>
      <a href="{{ url_for('admin.blocked') }}" class="{{ 'active' if request.endpoint == 'admin.blocked' }}">Blocked IPs</a>
    </nav>
    <form method="post" action="{{ url_for('admin.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="logout" type="submit">Sign out ({{ session.get('admin_name') }})</button>
    </form>
    {% endif %}
  </header>
  <main class="wrap">
    {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">CloudSOC Engine, restricted operations console</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
