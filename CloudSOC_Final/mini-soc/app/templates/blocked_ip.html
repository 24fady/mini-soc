{% extends "public_base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
    <div class="auth-wrapper">
        <div class="status-card">
            <div class="logo"><i class="fa-solid fa-ban"></i></div>
            <p class="status-code">403</p>
            <h1>Access denied</h1>
            <p>Invalid login activity was detected from your IP address ({{ ip }}), so access is suspended.
               You can try again in {{ retry }}.</p>
        </div>
    </div>
{% endblock %}
