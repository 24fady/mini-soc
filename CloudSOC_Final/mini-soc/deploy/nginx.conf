# /etc/nginx/sites-available/mini-soc  (symlink into sites-enabled, remove "default")
# Behind the ALB, TLS is terminated at the load balancer, so Nginx listens on 80.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    location /static/ {
        alias /opt/mini-soc/app/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ALB appends the real client IP; Nginx appends the ALB IP -> app uses PROXY_HOPS=2
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
    }
}
